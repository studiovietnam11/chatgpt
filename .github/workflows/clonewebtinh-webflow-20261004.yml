name: CloneWebTinh Webflow 12 Sites 2026-10-04

on:
  issues:
    types: [opened]

jobs:
  clone:
    if: github.event.issue.title == 'RUN_CLONEWEBTINH_WEBFLOW_20261004_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install wget
        run: sudo apt-get update -y && sudo apt-get install -y wget
      - name: Mirror sites
        run: python scripts/clonewebtinh_webflow.py ${{ matrix.batch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clonewebtinh-raw-batch-${{ matrix.batch }}
          path: clonewebtinh-raw-batch-${{ matrix.batch }}.zip
          retention-days: 1
          if-no-files-found: error
