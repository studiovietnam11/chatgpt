name: CloneWebTinh Webflow 12 Sites 2026-10-04

on:
  issues:
    types: [opened]

jobs:
  clone:
    if: github.event.issue.title == 'RUN_CLONEWEBTINH_WEBFLOW_20261004_V4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install wget
        run: sudo apt-get update -y && sudo apt-get install -y wget
      - name: Mirror sites
        run: python scripts/clonewebtinh_webflow.py ${{ matrix.batch }}
      - name: Upload raw batch
        uses: actions/upload-artifact@v4
        with:
          name: clonewebtinh-raw-batch-${{ matrix.batch }}
          path: clonewebtinh-raw-batch-${{ matrix.batch }}.zip
          retention-days: 1
          if-no-files-found: error

  package:
    if: github.event.issue.title == 'RUN_CLONEWEBTINH_WEBFLOW_20261004_V4'
    needs: clone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QA parser
        run: pip install beautifulsoup4
      - name: Download raw batches
        uses: actions/download-artifact@v4
        with:
          pattern: clonewebtinh-raw-batch-*
          path: incoming
          merge-multiple: true
      - name: Package and QA
        run: python scripts/package_clonewebtinh.py incoming CLONEWEBTINH-WEBFLOW-12
      - name: Create final ZIP
        run: zip -qr CLONEWEBTINH-WEBFLOW-12-FINAL.zip CLONEWEBTINH-WEBFLOW-12
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: CLONEWEBTINH-WEBFLOW-12-FINAL
          path: CLONEWEBTINH-WEBFLOW-12-FINAL.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
