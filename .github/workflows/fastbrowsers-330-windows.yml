name: FASTBROWSERS 3.3 Windows Setup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fastbrowsers-330-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Assemble profile-preserving source
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/chienbm98/foxprofile/archive/refs/tags/v2.3.1.zip' -OutFile upstream.zip
          Expand-Archive upstream.zip upstream -Force
          Move-Item upstream/foxprofile-2.3.1 app
          Expand-Archive scripts/fastbrowsers/FASTBROWSERS-3.0.0-Overlay.zip app -Force
          Expand-Archive scripts/fastbrowsers/FASTBROWSERS-3.1.0-Patch.zip app -Force
          Expand-Archive scripts/fastbrowsers/FASTBROWSERS-3.2.0-Patch.zip app -Force
          python -c "import pathlib,base64,zlib; source=pathlib.Path('scripts/fastbrowsers/apply-321.zlib.b64'); pathlib.Path('patch321.py').write_bytes(zlib.decompress(base64.b64decode(source.read_bytes())))"
          python patch321.py
          if ($LASTEXITCODE -ne 0) { throw '3.2.1 base patch failed' }
          python scripts/fastbrowsers/apply-330.py
          if ($LASTEXITCODE -ne 0) { throw '3.3 patch failed' }
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and smoke-test
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'windows/build-FASTBROWSERS.ps1'
          $body = (Get-Content $script -Raw -Encoding UTF8).Replace(' tests/test_state.py','')
          Set-Content $script $body -Encoding UTF8
          ./windows/build-FASTBROWSERS.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $exe = 'release/FASTBROWSERS-Setup-3.3.0-Win64.exe'
          if (-not (Test-Path $exe)) { throw 'Setup missing' }
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: FASTBROWSERS-Setup-3.3.0-Win64
          path: app/release/FASTBROWSERS-Setup-3.3.0-Win64.exe
          if-no-files-found: error
      - name: Publish direct EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file='app/release/FASTBROWSERS-Setup-3.3.0-Win64.exe'
          gh release create fastbrowsers-v3.3.0 $file --title 'FASTBROWSERS 3.3.0 Windows Setup' --notes 'Graceful profile shutdown, persistent browser sessions, and observed versus configured IP and browser data. Unsigned Windows prerelease. Do not delete profile data when installing.' --prerelease --repo $env:GITHUB_REPOSITORY
