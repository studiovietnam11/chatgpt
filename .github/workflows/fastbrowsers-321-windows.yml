name: FASTBROWSERS 3.2.1 Windows Setup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fastbrowsers-321-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Assemble FASTBROWSERS source
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/chienbm98/foxprofile/archive/refs/tags/v2.3.1.zip' -OutFile upstream.zip
          Expand-Archive upstream.zip upstream -Force
          Move-Item upstream/foxprofile-2.3.1 app
          Expand-Archive scripts/fastbrowsers/FASTBROWSERS-3.0.0-Overlay.zip app -Force
          Expand-Archive scripts/fastbrowsers/FASTBROWSERS-3.1.0-Patch.zip app -Force
          Expand-Archive scripts/fastbrowsers/FASTBROWSERS-3.2.0-Patch.zip app -Force
          python -c "import pathlib,base64,zlib; source=pathlib.Path('scripts/fastbrowsers/apply-321.zlib.b64'); dest=pathlib.Path('patch321.py'); dest.write_bytes(zlib.decompress(base64.b64decode(source.read_bytes())))"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare 3.2.1 patch' }
          python patch321.py
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply 3.2.1 patch' }
          if (-not (Test-Path 'app/tests/test_fastbrowsers_321.py')) { throw '3.2.1 tests missing' }
          if (-not (Test-Path 'app/windows/FASTBROWSERS.iss')) { throw 'Setup definition missing' }
          if (-not (Test-Path 'app/windows/build-FASTBROWSERS.ps1')) { throw 'Build script missing' }
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Run tests and build Setup EXE
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'windows/build-FASTBROWSERS.ps1'
          $body = Get-Content $script -Raw -Encoding UTF8
          $body = $body.Replace(' tests/test_state.py','')
          Set-Content $script $body -Encoding UTF8
          ./windows/build-FASTBROWSERS.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $exe = 'release/FASTBROWSERS-Setup-3.2.1-Win64.exe'
          if (-not (Test-Path $exe)) { throw 'Windows Setup EXE not found' }
          Get-Item $exe | Select-Object Name, Length
          Get-FileHash $exe -Algorithm SHA256
      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FASTBROWSERS-Setup-3.2.1-Win64
          path: app/release/FASTBROWSERS-Setup-3.2.1-Win64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish single EXE direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'fastbrowsers-v3.2.1'
          $exe = 'app/release/FASTBROWSERS-Setup-3.2.1-Win64.exe'
          $notes = 'FASTBROWSERS 3.2.1 Windows 64-bit. Fixes workspace tab refresh callback error, adds IP recheck and account logout control. Offline setup; unsigned prerelease. Preserves existing profiles. Automated Windows startup smoke test; live profile/account interactions should be checked on user Windows PC.'
          gh release create $tag $exe --title 'FASTBROWSERS 3.2.1 Windows Setup' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
